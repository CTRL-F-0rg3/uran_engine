[workspace]
resolver = "2"
members = [
    "crates/*", "farm-simulator", "junak-rider",
    "boss-fight",
    "uran-engine",   # <-- Zmienione z "engine"
    "uran-game",     # <-- Zmienione z "game"
    "uran-tanks", "stardew-demo",    # FPS z czołgami (renderer 3D)
]

[workspace.dependencies]
# Zewnętrzne
wgpu = "0.19"
winit = "0.30"
glam = "0.25"
ab_glyph = "0.2"      # rasteryzacja glifów (font atlas)
image = { version = "0.25", default-features = false, features = ["png"] }
rapier2d = "0.19"     # fizyka 2D (na razie nieużywana)
tracing = "0.1"
anyhow = "1.0"
thiserror = "1.0"
pollster = "0.3"
bytemuck = { version = "1.14", features = ["derive"] }

# Wewnętrzne (ułatwia linkowanie między crate'ami)
uran-core = { path = "crates/uran-core" }
uran-math = { path = "crates/uran-math" }
uran-ecs = { path = "crates/uran-ecs" }
uran-asset = { path = "crates/uran-asset" }
uran-render = { path = "crates/uran-render" }
uran-render3d = { path = "crates/uran-render3d" }
uran-physics = { path = "crates/uran-physics" }
uran-audio = { path = "crates/uran-audio" }
uran-engine = { path = "uran-engine" }
uran-tilemap = { path = "crates/uran-tilemap" }
